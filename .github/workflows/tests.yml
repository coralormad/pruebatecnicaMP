name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: misterplan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Importar esquema
        run: mysql -h 127.0.0.1 -uroot -proot misterplan_test < database/reservas.sql

      - name: Crear .env.testing
        run: |
          cat > .env.testing <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=misterplan_test
          DB_USER=root
          DB_PASS=root
          APP_DEBUG=false
          EOF

      - name: PHPUnit
        run: vendor/bin/phpunit --fail-on-skipped
